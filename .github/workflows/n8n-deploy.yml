name: n8n Deployment

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'tests/**'
      - '.github/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'LICENSE'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-package:
    name: Build n8n image and prepare deploy bundle
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    outputs:
      image_with_tag: ${{ steps.bundle.outputs.image_with_tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compute lowercase image name
        run: |
          LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_NAME=${LOWER}" >> "$GITHUB_ENV"

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for n8n
        id: meta-n8n
        uses: docker/metadata-action@v7
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/n8n
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container

      - name: Build and push n8n image
        id: push-n8n
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.n8n
          push: true
          tags: ${{ steps.meta-n8n.outputs.tags }}
          labels: ${{ steps.meta-n8n.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          pull: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate artifact attestation for n8n
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/n8n
          subject-digest: ${{ steps.push-n8n.outputs.digest }}
          push-to-registry: true

      - name: Prepare deploy bundle
        id: bundle
        run: |
          mkdir -p deploy

          # Use the first tag emitted by metadata-action (the branch ref, e.g. ...:main)
          IMAGE_WITH_TAG=$(echo "${{ steps.meta-n8n.outputs.tags }}" | head -n 1)
          echo "image_with_tag=${IMAGE_WITH_TAG}" >> "$GITHUB_OUTPUT"

          cat > deploy/.env << EOF
          N8N_BASIC_AUTH_USER=${{ secrets.N8N_USER }}
          N8N_BASIC_AUTH_PASSWORD=${{ secrets.N8N_PASSWORD }}
          N8N_USER_MANAGEMENT_JWT_SECRET=${{ secrets.N8N_JWT_SECRET }}
          N8N_ENCRYPTION_KEY=${{ secrets.N8N_ENCRYPTION_KEY }}
          DB_POSTGRESDB_USER=${{ secrets.POSTGRES_USER }}
          DB_POSTGRESDB_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_USER=${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          EOF

          cat > deploy/docker-compose.prod.yaml << 'EOF'
          services:
            n8n:
              env_file:
                - .env
              user: root
              image: ${IMAGE_WITH_TAG}
              container_name: n8n
              network_mode: host
              restart: unless-stopped
              depends_on:
                - postgres
                - redis
              environment:
                # N8N Environment
                - N8N_TRUSTED_PROXIES=0.0.0.0/0
                - NODE_OPTIONS=-r /tracer/tracing.js --dns-result-order=ipv4first
                - N8N_BASIC_AUTH_ACTIVE=true
                # - N8N_BASIC_AUTH_USER=${N8N_USER}
                # - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD}
                - N8N_HOST=n8n.ivanildobarauna.dev
                - WEBHOOK_TUNNEL_URL=https://n8n.ivanildobarauna.dev
                - WEBHOOK_URL=https://n8n.ivanildobarauna.dev/
                - GENERIC_TIMEZONE=UTC
                - N8N_PORT=5678
                - N8N_REDIS_HOST=localhost
                - N8N_REDIS_PORT=6379
                - N8N_REDIS_DB=0
                - N8N_REDIS_PASSWORD="redis"
                - N8N_USER_MANAGEMENT_DISABLED=true
                # - N8N_USER_MANAGEMENT_JWT_SECRET=${N8N_JWT_SECRET}
                # - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
                - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
                - NODES_EXCLUDE="[]"
                # Configurações do PostgreSQL
                - DB_TYPE=postgresdb
                - DB_POSTGRESDB_HOST=127.0.0.1
                - DB_POSTGRESDB_PORT=5432
                - DB_POSTGRESDB_DATABASE=n8n
                # - DB_POSTGRESDB_USER=${POSTGRES_USER}
                # - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
                # Configurações do Datadog
                - DD_SERVICE=n8n
                - DD_ENV=production
                - DD_VERSION=1.0.0
                - DD_TRACE_SAMPLE_RATE=1.0
                - DD_AGENT_HOST=localhost
                - DD_TAGS="app:n8n"
                - DD_TRACE_REMOVE_INTEGRATION_SERVICE_NAMES_ENABLED=true
              volumes:
                - type: volume
                  source: n8n_data
                  target: /home/node/.n8n
                  volume:
                    nocopy: true
                - /var/run/docker.sock:/var/run/docker.sock
                - /root/n8n_ssh_key:/root/.ssh/id_rsa:ro
                - /root/n8n_ssh_config:/root/.ssh/config:ro
                - /root/n8n_known_hosts:/root/.ssh/known_hosts
              labels:
                com.datadoghq.ad.logs: '[{"source": "nodejs", "service": "n8n.ivanildobarauna.dev"}]'
                tags.env: "production"
                tags.service: "n8n.ivanildobarauna.dev"
                tags.tech: "nodejs"
                tags.app: "n8n"
                tags.role: "automation"

            postgres:
              image: postgres:15
              container_name: postgres
              network_mode: host
              restart: unless-stopped
              environment:
                - DD_SERVICE=postgres
                - DD_ENV=production
                - DD_VERSION=1.0.0
                - DD_TRACE_SAMPLE_RATE=1.0
                - DD_AGENT_HOST=localhost
                - DD_TAGS="app:postgres"
                - DD_TRACE_REMOVE_INTEGRATION_SERVICE_NAMES_ENABLED=true
                # - POSTGRES_USER=${POSTGRES_USER}
                # - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
                - POSTGRES_DB=n8n
              command: >
                postgres
                -c shared_preload_libraries=pg_stat_statements
                -c track_activity_query_size=4096
                -c pg_stat_statements.track=ALL
                -c pg_stat_statements.max=10000
                -c pg_stat_statements.track_utility=off
                -c track_io_timing=on
              volumes:
                - postgres_data:/var/lib/postgresql/data
              labels:
                com.datadoghq.ad.logs: '[{"source": "postgresql", "service": "postgres.n8n"}]'
                tags.env: "production"
                tags.Service: "postgres.n8n"
                tags.tech: "postgres"
                tags.app: "n8n"
                tags.role: "database"

            redis:
              env_file:
                - .env
              image: redis:7
              container_name: redis
              network_mode: host
              restart: unless-stopped
              environment:
                - DD_SERVICE=redis
                - DD_ENV=production
                - DD_VERSION=1.0.0
                - DD_TRACE_SAMPLE_RATE=1.0
                - DD_TAGS="app:redis"
                - DD_TRACE_REMOVE_INTEGRATION_SERVICE_NAMES_ENABLED=true
              command: [
                "redis-server",
                "--appendonly", "yes",
                "--requirepass", "redis",
                "--protected-mode", "yes",
                "--maxmemory", "512mb",
                "--maxmemory-policy", "allkeys-lru"
              ]
              volumes:
                - redis_data:/data
              labels:
                com.datadoghq.ad.logs: '[{"source": "redis", "service": "redis.n8n"}]'
                tags.env: "production"
                tags.Service: "redis.n8n"
                tags.tech: "redis"
                tags.app: "n8n"
                tags.role: "cache"

          volumes:
            n8n_data:
              external: true
            postgres_data:
              external: true
            redis_data:
              external: true
          EOF

          # Substitute IMAGE_WITH_TAG into the compose file
          sed -i "s|\${IMAGE_WITH_TAG}|${IMAGE_WITH_TAG}|g" deploy/docker-compose.prod.yaml

      - name: Upload deploy bundle
        uses: actions/upload-artifact@v4
        with:
          name: n8n-deploy-bundle
          path: deploy/
          retention-days: 1

  deploy:
    needs: build-and-package
    uses: ivanildobarauna/github-workflows/.github/workflows/deploy-compose-ssh.yml@v1
    with:
      artifact-name: n8n-deploy-bundle
      compose-file: docker-compose.prod.yaml
      remote-path: /home/ubuntu/app/n8n
      pull-policy-always: true
      force-recreate: true
      # Remove the previously-pulled image to force the pull to fetch a fresh copy
      # of the mutable branch tag. Tolerates the image not existing locally yet.
      pre-deploy-command: |
        docker rmi -f "$(docker image inspect ${{ needs.build-and-package.outputs.image_with_tag }} -f '{{.ID}}' 2>/dev/null || true)" 2>/dev/null || true
      environment: Production
    secrets:
      VPS_SSH_HOST: ${{ secrets.VPS_SSH_HOST }}
      VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
      VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
